[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "blastcontain-verify"
version = "0.5.0"
description = "Technical security assessment for AI agents and MCP servers, with SARIF and signed audit packets"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "BlastContain Contributors" }]
keywords = [
    "ai-safety", "agent-security", "compliance", "scanner",
    "sarif", "mit-ai-risk", "mcp", "presidio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "blastcontain-core>=0.2,<1.0",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage      = "https://github.com/blastcontain/verify"
Repository    = "https://github.com/blastcontain/verify"
Issues        = "https://github.com/blastcontain/verify/issues"
Documentation = "https://github.com/blastcontain/verify/blob/main/docs/spec.md"

[project.optional-dependencies]
# Secure-by-default: [full] is the CVE-clean augmentation set (Presidio + AGT).
full  = [
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer==2.2.363",
    "agent-governance-toolkit>=4.1.0",
]
# Anonymizer 2.2.364 requires cryptography<49, excluding the security fixes.
# Keep the audited version until upstream permits patched cryptography.
# See SECURITY.md; dependency update PRs must pass the audit before merging.
pii   = ["presidio-analyzer>=2.2.364", "presidio-anonymizer==2.2.363"]
agt   = ["agent-governance-toolkit>=4.1.0"]

# Cisco AI Defense — OPT-IN (SKILL-02). cisco-ai-skill-scanner>=2.0.12 raised its
# litellm floor to >=1.84, which lets the fixed aiohttp/python-dotenv resolve, so
# this tree is now CVE-clean. `cisco` is an alias for `skill`.
#
# NOTE: cisco-ai-mcp-scanner (the MCP-01 backend) is intentionally NOT packaged.
# Every release still exact-pins litellm==1.83.7 (CVE-2026-34993/-47265/-40217/
# -28684), and it conflicts with skill>=2.0.12's litellm>=1.84 — they can no
# longer coexist. MCP-01 is also dormant (SKIPs without a Charter), so it buys
# nothing today. Re-add it when upstream relaxes the litellm pin AND Charter
# wiring activates MCP-01. See SECURITY.md.
skill = ["cisco-ai-skill-scanner>=2.1.0"]
cisco = ["cisco-ai-skill-scanner>=2.1.0"]

# Official SDK is used only by the practical validation reference server/tests.
validation-test = ["mcp==2.2.0"]

dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
]

[project.scripts]
blastcontain-verify = "blastcontain_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["blastcontain_verify"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
