name: Drill local workbench

on:
  pull_request:
    paths:
      - 'core/**'
      - 'drill/**'
      - 'tools/scout/**'
      - '.github/workflows/drill-ui.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'drill/**'
      - 'tools/scout/**'
      - '.github/workflows/drill-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install host and pinned browser test tools
        run: python -m pip install ./core './drill[dev,ui-test]' ./tools/scout
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser and HTTP security validation
        run: python -m pytest drill/tests/browser drill/tests/unit/workbench -q --basetemp=ui-test-results
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-browser-evidence
          path: ui-test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
