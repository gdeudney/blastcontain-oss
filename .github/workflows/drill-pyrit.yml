name: Drill PyRIT adapter

on:
  pull_request:
    paths:
      - 'core/**'
      - 'drill/blastcontain_drill/**'
      - 'drill/plugins/pyrit/**'
      - '.github/workflows/drill-pyrit.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'drill/blastcontain_drill/**'
      - 'drill/plugins/pyrit/**'
      - '.github/workflows/drill-pyrit.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyrit-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install host test tools
        run: python -m pip install ./core './drill[dev]' pip-audit
      - name: Audit isolated plugin dependencies
        run: pip-audit --disable-pip --no-deps -r drill/plugins/pyrit/requirements.lock
      - name: Build pinned plugin image
        id: image
        shell: python
        run: |
          import os, pathlib, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pyrit-image-id'
          subprocess.run(['podman', '--remote=false', 'build', '--iidfile', str(path), '-f', 'drill/plugins/pyrit/Containerfile', '.'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image_id=' + path.read_text().strip() + '\n')
      - name: Real upstream parity and worker conformance
        env:
          DRILL_PYRIT_IMAGE: ${{ steps.image.outputs.image_id }}
        run: python -m pytest drill/plugins/pyrit/tests -q
